<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競輪 期待値検証ツール</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<header>
  <h1>競輪 期待値検証ツール</h1>
</header>

<main>
  <section class="card">
    <h2>① スクショ解析</h2>
    <p class="note">出走表・直近成績・勝率・オッズ(全券種)のスクショをまとめて選択してください。複数レース分をまとめてもOKです。</p>
    <input type="file" id="screenshotInput" multiple accept="image/*">
    <button id="uploadBtn">解析してDBに反映</button>
    <div id="uploadResult" class="result-box"></div>
  </section>

  <section class="card">
    <h2>② レース選択・期待値計算</h2>
    <button id="loadRacesBtn">レース一覧を更新</button>
    <select id="raceSelect"></select>
    <button id="deleteRaceBtn" style="background:#ef4444;">選択中のレースを削除(やり直し用)</button>
    <label>証拠金(円)</label>
    <input type="number" id="bankrollInput" value="10000">
    <label>フラクショナルケリー係数(0-1)</label>
    <input type="number" id="kellyCoefInput" value="0.25" step="0.05">
    <label>最低勝率フィルター(%)</label>
    <input type="number" id="minProbInput" value="5" step="1">
    <button id="calcEvBtn">期待値を計算</button>
    <div id="evResult" class="result-box"></div>
  </section>

  <section class="card">
    <h2>③ 購入記録</h2>
    <p class="note">上の一覧で購入した買い目を手動で記録してください。</p>
    <input type="text" id="purchaseBetType" placeholder="券種(例: 3連単)">
    <input type="text" id="purchaseCombination" placeholder="買い目(例: 1-2-3)">
    <input type="number" id="purchaseStake" placeholder="購入金額">
    <button id="recordPurchaseBtn">記録する</button>
    <div id="purchaseResult" class="result-box"></div>
  </section>

  <section class="card">
    <h2>④ 資金管理シミュレーション(破産確率)</h2>
    <label>勝率(%)</label>
    <input type="number" id="simWinProb" value="30">
    <label>オッズ</label>
    <input type="number" id="simOdds" value="3.0" step="0.1">
    <label>1点あたり賭け比率(%)</label>
    <input type="number" id="simStakePct" value="2" step="0.5">
    <label>試行あたりの賭け回数</label>
    <input type="number" id="simNumBets" value="100">
    <button id="runSimBtn">シミュレーション実行</button>
    <div id="simResult" class="result-box"></div>
  </section>

  <section class="card">
    <h2>⑤ 実績検証</h2>
    <button id="loadStatsBtn">集計を表示</button>
    <div id="statsResult" class="result-box"></div>
  </section>
</main>

<script src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js");
  });
}
</script>
</body>
</html>
